name: Format

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_call:
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  PACKAGE_MANAGER: poetry
  PYTHON_VERSION: "3.13"

jobs:
  changes:
    name: Identify changes
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.dedupe.outputs.should_skip }}
      named: ${{ steps.dedupe.outputs.named }}
    steps:
      - name: Dedupe
        id: dedupe
        uses: lojoja/action-dedupe@main
        with:
          github_token: ${{ github.token }}
          paths: |
            - .github/workflows/format.yml
          paths_named: |
            black:
              paths:
                - "**.py"
                - ${{ env.PACKAGE_MANAGER }}.lock
                - pyproject.toml
            prettier:
              paths_ignore:
                - "**.lock"
                - "**.py"
                - "**.toml"
                - LICENSE

  black:
    name: Black
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.should_skip == 'false' || ! fromJSON(needs.changes.outputs.named).black.should_skip
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run black
        uses: lojoja/action-black@main
        with:
          package_manager: ${{ env.PACKAGE_MANAGER }}
          python_version: ${{ env.PYTHON_VERSION }}

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.should_skip == 'false' || ! fromJSON(needs.changes.outputs.named).prettier.should_skip
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run prettier
        uses: lojoja/action-prettier@main
        with:
          install: "true"
          node_version: ${{ env.NODE_VERSION }}

  result:
    name: Format result
    runs-on: ubuntu-latest
    if: always()
    needs:
      - black
      - prettier
    steps:
      - name: Format failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Format passed
        run: exit 0
