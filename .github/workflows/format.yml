name: Format

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  changed-files:
    name: Identify changed files
    runs-on: ubuntu-latest
    outputs:
      others_changed: ${{ steps.set-result.outputs.others_changed }}
      python_changed: ${{ steps.set-result.outputs.python_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Check for non-python source changes
        id: others-changed
        uses: tj-actions/changed-files@b74df86ccb65173a8e33ba5492ac1a2ca6b216fd
        with:
          files_ignore: |
            **/*.py
            poetry.lock
            pyproject.toml

      - name: Check for python source changes
        id: python-changed
        uses: tj-actions/changed-files@b74df86ccb65173a8e33ba5492ac1a2ca6b216fd
        with:
          files: |
            .github/workflows/format.yml
            **/*.py
            poetry.lock
            pyproject.toml

      - name: Set file change results
        id: set-result
        run: |
          echo "others_changed=${{ steps.others-changed.outputs.any_changed }}" >> "$GITHUB_OUTPUT"
          echo "python_changed=${{ steps.python-changed.outputs.any_changed }}" >> "$GITHUB_OUTPUT"

  black:
    name: Black
    runs-on: ubuntu-latest
    needs: changed-files
    if: ${{ needs.changed-files.outputs.python_changed == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup python environment
        uses: lojoja/action-setup-python-env@main
        with:
          python-version: "3.11"

      - name: Run black
        run: poetry run black --check .

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    needs: changed-files
    if: ${{ needs.changed-files.outputs.others_changed == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup node environment
        uses: lojoja/action-setup-node-env@main
        with:
          node-version: 22

      - name: Run prettier
        run: pnpm prettier --check .
