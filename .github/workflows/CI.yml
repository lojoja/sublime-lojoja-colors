name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  PYTHON_PACKAGE_MANAGER: poetry
  PYTHON_VERSION: "3.13"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.dedupe.outputs.should_skip }}
      named: ${{ steps.dedupe.outputs.named }}
    steps:
      - name: Dedupe
        id: dedupe
        uses: lojoja/action-dedupe@main
        with:
          github_token: ${{ github.token }}
          paths: |
            - .github/workflows/CI.yml
          paths_named: |
            data:
              paths:
                - src/data/**
            prettier:
              paths_ignore:
                - "**.lock"
                - "**.py"
                - "**.toml"
                - LICENSE
            python:
              paths:
                - "**.py"
                - ${{ env.PYTHON_PACKAGE_MANAGER }}.lock
                - pyproject.toml

  black:
    name: Black
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.should_skip == 'false' || ! fromJSON(needs.changes.outputs.named).python.should_skip
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Run black
        uses: lojoja/action-black@main
        with:
          package_manager: ${{ env.PYTHON_PACKAGE_MANAGER }}
          python_version: ${{ env.PYTHON_VERSION }}

  data:
    name: Data
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.should_skip == 'false' || ! fromJSON(needs.changes.outputs.named).data.should_skip
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup python environment
        uses: lojoja/action-setup-python-env@main
        with:
          package_manager: ${{ env.PYTHON_PACKAGE_MANAGER }}
          python_version: ${{ env.PYTHON_VERSION }}

      - name: Run validate
        run: ${{ env.PYTHON_PACKAGE_MANAGER }} run validate

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.should_skip == 'false' || ! fromJSON(needs.changes.outputs.named).prettier.should_skip
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Run prettier
        uses: lojoja/action-prettier@main
        with:
          install: "true"
          node_version: ${{ env.NODE_VERSION }}

  pylint:
    name: Pylint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.should_skip == 'false' || ! fromJSON(needs.changes.outputs.named).python.should_skip
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Run pylint
        uses: lojoja/action-pylint@main
        with:
          package_manager: ${{ env.PYTHON_PACKAGE_MANAGER }}
          python_version: ${{ env.PYTHON_VERSION }}

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.should_skip == 'false' || ! fromJSON(needs.changes.outputs.named).python.should_skip
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Run pytest
        uses: lojoja/action-pytest@main
        with:
          coverage: "true"
          package_manager: ${{ env.PYTHON_PACKAGE_MANAGER }}
          python_version: ${{ env.PYTHON_VERSION }}

  ci-result:
    name: CI Result
    runs-on: ubuntu-latest
    if: always()
    needs:
      - black
      - data
      - prettier
      - pylint
      - pytest
    steps:
      - name: CI failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: CI passed
        run: exit 0
