name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_call:
  workflow_dispatch:

env:
  PACKAGE_MANAGER: poetry
  PYTHON_VERSION: "3.13"

jobs:
  changes:
    name: Identify changes
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.dedupe.outputs.should_skip }}
    steps:
      - name: Dedupe
        id: dedupe
        uses: lojoja/action-dedupe@main
        with:
          github_token: ${{ github.token }}
          paths: |
            - "**.py"
            - .github/workflows/tests.yml
            - ${{ env.PACKAGE_MANAGER }}.lock
            - pyproject.toml

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.should_skip == 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run pytest
        uses: lojoja/action-pytest@main
        with:
          coverage: "true"
          package_manager: ${{ env.PACKAGE_MANAGER }}
          python_version: ${{ env.PYTHON_VERSION }}

  result:
    name: Tests result
    runs-on: ubuntu-latest
    if: always()
    needs:
      - pytest
    steps:
      - name: Tests failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Tests passed
        run: exit 0
