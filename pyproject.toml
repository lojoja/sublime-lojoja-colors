[project]
name = "sublime-lojoja-colors"
version = "1.1.7a0"
description = "A collection of color schemes for Sublime Text with extended scope, language, and package support."
authors = [{ name = "lojoja", email = "dev@lojoja.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["pydantic>=2.10.4,<3"]

[project.scripts]
build = "sublime_lojoja_colors:build"
schema = "sublime_lojoja_colors:config_schema"
validate = "sublime_lojoja_colors:validate"

[project.urls]
homepage = "https://github.com/lojoja/sublime-lojoja-colors"
repository = "https://github.com/lojoja/sublime-lojoja-colors"
"Bug Tracker" = "https://github.com/lojoja/sublime-lojoja-colors/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=26.1.0,<27",
    "pylint>=4.0.4,<5",
    "pyright>=1.1.408,<2",
    "pytest>=9.0.2,<10",
    "pytest-cov>=7.0.0,<8",
    "pytest-mock>=3.15.1,<4",
]

[tool.black]
include = '\.pyi?$'
line-length = 120
skip-magic-trailing-comma = true
target_version = ["py311"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.coverage.run]
source = ["src"]
omit = ["tests"]
branch = true

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
include = ["*.py", "data/"]
exclude = ["tests/**"]

[tool.pylint.main]
ignore-paths = ["^(.*/)?.venv/.*$"]
load-plugins = ["pylint.extensions.mccabe"]

[tool.pylint.design]
max-complexity = 15

[tool.pylint.format]
max-line-length = 120

[tool.pyright]
ignore = [".venv/*"]
pythonVersion = "3.11"
venv = ".venv"
venvPath = "."

[tool.pytest]
testpaths = ["tests"]
strict_markers = true
markers = []
filterwarnings = []

[tool.uv]
package = false
